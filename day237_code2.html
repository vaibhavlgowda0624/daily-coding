<form>
  <h2>Sorting Visualizer</h2>

  <label for="numbers">Enter numbers:</label>
  <input
    id="numbers"
    type="text"
    placeholder="5, 2, 8, 1"
  >

  <label for="algorithm">Algorithm:</label>
  <select id="algorithm">
    <option>Bubble Sort</option>
    <option>Merge Sort</option>
    <option>Quick Sort</option>
  </select>

  <button type="submit">Sort</button>
</form>
